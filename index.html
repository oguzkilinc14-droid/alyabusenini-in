<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14 Şubat 💙</title>
</head>
<body style="background:#0b1f3a; color:white; text-align:center;">

<h1>14 Şubatımız Kutlu Olsun 💘</h1>

<img src="foto.jpg" width="300">

<br><br>

<audio id="bgMusic" controls loop>
    <source src="muzik.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("bgMusic");

// Otomatik başlatmayı dene
function startMusic() {
    music.volume = 0.4;
    music.play().catch(() => {});
}

window.addEventListener("load", startMusic);
document.addEventListener("click", startMusic, { once: true });
</script>

</body>
</html>
