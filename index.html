<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14 Şubat 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0b1f3a, #162a4d, #1f3c73);
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
}

h1 {
    margin-bottom: 20px;
    text-shadow: 0 0 15px rgba(255,255,255,0.7);
}

img {
    width: 300px;
    max-width: 80%;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    transition: 0.4s;
}

img:hover {
    transform: scale(1.05);
}
</style>
</head>
<body>

<h1>14 Şubatımız Kutlu Olsun 💘</h1>

<img src="foto.jpg" alt="Bizim Fotoğrafımız">

<audio id="bgMusic" autoplay loop muted>
    <source src="muzik.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("bgMusic");

// 1:36'dan başlasın
music.addEventListener("loadedmetadata", () => {
    music.currentTime = 96;
});

window.addEventListener("load", () => {
    music.muted = false;
    music.volume = 0.4;

    music.play().catch(() => {
        document.addEventListener("click", () => {
            music.play();
        }, { once: true });
    });
});
</script>

</body>
</html>
