<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14 Şubat 💙</title>
</head>
<body style="background:#0b1f3a; color:white; text-align:center;">

<h1>14 Şubatımız Kutlu Olsun 💘</h1>

<img src="foto.jpg" width="300">

<audio id="bgMusic" loop>
    <source src="muzik.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("bgMusic");

// Metadata gelince 1:36'ya sar
music.addEventListener("loadedmetadata", () => {
    music.currentTime = 96;
});

// Çalmayı dene
function startMusic() {
    music.volume = 0.4;
    music.play().catch(() => {});
}

// Sayfa yüklenince dene
window.addEventListener("load", startMusic);

// Eğer engellenirse ilk herhangi bir etkileşimde başlat
document.addEventListener("click", startMusic, { once: true });
document.addEventListener("touchstart", startMusic, { once: true });
</script>

</body>
</html>
