<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>14 Şubat 💙</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #0b1c3d; /* Lacivert */
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
}

/* Fotoğraf */
.photo {
    width: 260px;
    height: 260px;
    border-radius: 20px;
    object-fit: cover;
    box-shadow: 0 0 25px rgba(255,255,255,0.3);
    margin-bottom: 25px;
    transition: 0.3s;
}

.photo:hover {
    transform: scale(1.05);
}

/* Buton */
button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #0b1c3d;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}
</style>
</head>
<body>

<h1>💙 14 Şubat Sürprizi 💙</h1>

<img src="foto.jpg" alt="Bizim Fotoğrafımız" class="photo">

<button onclick="toggleMusic()" id="musicBtn">
🎵 Müziği Aç
</button>

<audio id="bgMusic" loop>
    <source src="muzik.mp3" type="audio/mp3">
</audio>

<script>
const music = document.getElementById("bgMusic");
const button = document.getElementById("musicBtn");

function toggleMusic() {
    if (music.paused) {
        music.play();
        button.innerHTML = "⏸ Müziği Kapat";
    } else {
        music.pause();
        button.innerHTML = "🎵 Müziği Aç";
    }
}
</script>

</body>
</html>
